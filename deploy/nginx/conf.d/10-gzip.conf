# Ubuntu ships gzip on but with gzip_types commented out, which compresses only
# text/html. A static export is mostly CSS, JS and JSON, so it needs the rest.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml
    font/ttf
    font/otf
    application/vnd.ms-fontobject;
