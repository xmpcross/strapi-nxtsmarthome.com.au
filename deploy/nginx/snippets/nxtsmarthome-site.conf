# Serving rules for nxtsmarthome.com.au, shared by the HTTP and HTTPS vhosts.
# Included from sites-available/nxtsmarthome.com.au — not a standalone config.

# www → apex, before anything else answers.
if ($host ~* ^www\.) {
    return 301 $scheme://nxtsmarthome.com.au$request_uri;
}

# Article and product-variant 301s, generated with the build.
if ($nxtsmarthome_redirect) {
    return 301 $nxtsmarthome_redirect$is_args$args;
}

# The build's own control files are host configuration, not site content.
location ~ ^/_(redirects|headers) {
    return 404;
}

location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location / {
    # Every page of the export is <path>/index.html, so /page/ resolves through
    # the second test and real files through the first. Anything else falls to
    # @canonical, which redirects or 404s — it never 200s an error page.
    try_files $uri ${uri}index.html @canonical;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}

location @canonical {
    # Empty means the URI already ends in a slash, so there is no canonical form
    # to send it to — it is simply missing.
    if ($nxtsmarthome_slash = "") {
        return 404;
    }
    if (-f $document_root$nxtsmarthome_slash/index.html) {
        return 301 $nxtsmarthome_slash/$is_args$args;
    }
    return 404;
}

# Hashed build assets: the name changes when the content does.
location ^~ /_next/static/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ^~ /covers/ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ~ ^/(sitemap\.xml|search-index\.json)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location ~* \.(?:avif|webp|jpe?g|png|gif|ico|svg|css|js|woff2?|ttf|otf)$ {
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# 404.html is exported by the build; error_page keeps the status honest.
error_page 404 /404.html;
location = /404.html {
    internal;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}
