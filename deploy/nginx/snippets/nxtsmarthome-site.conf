# Serving rules for nxtsmarthome.com.au, shared by the HTTPS vhost.
# Included from sites-available/nxtsmarthome.com.au — not a standalone config.
#
# Pages come from the Next.js server on 127.0.0.1:3013. It handles the trailing
# slash (trailingSlash: true), 404s, and cache headers for /_next/static/.

# www → apex, before anything else answers.
if ($host ~* ^www\.) {
    return 301 https://nxtsmarthome.com.au$request_uri;
}

# Article and product-variant 301s, generated with the build.
if ($nxtsmarthome_redirect) {
    return 301 $nxtsmarthome_redirect$is_args$args;
}

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Contact form and comments awaiting moderation: a loopback service that sends
# them on through Stalwart SMTP (/opt/nxtsmarthome-contact).
location ~ ^/api/(contact|comment)$ {
    proxy_pass http://127.0.0.1:4320;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
}

# Draft preview, a static export published by scripts/deploy-preview.sh.
location ^~ /preview/ {
    root /var/www/nxtsmarthome-preview;
    try_files $uri ${uri}index.html =404;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Build control files are host configuration, not site content.
location ~ ^/_(redirects|headers) {
    return 404;
}

location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location / {
    proxy_pass http://127.0.0.1:3013;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
}
